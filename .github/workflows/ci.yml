name: Android CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-26' 'build-tools;26.0.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest jacocoTestReport
      - name: Require 90 percent application line coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = list(Path('app/build/reports/jacoco').rglob('*.xml'))
          assert len(reports) == 1, 'Expected one JaCoCo application report'
          counter = ET.parse(reports[0]).getroot().find("counter[@type='LINE']")
          assert counter is not None, 'Missing application coverage'
          covered, missed = int(counter.get('covered')), int(counter.get('missed'))
          assert covered + missed > 0, 'No application lines measured'
          percent = 100 * covered / (covered + missed)
          print(f'Application line coverage: {percent:.2f}% ({covered}/{covered + missed})')
          assert percent >= 90, 'Application coverage is below 90%'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            app/build/reports
            app/build/test-results
            app/build/outputs/apk/debug/*.apk
