apply plugin: 'com.android.application'
apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.8'
}

android {
    compileSdkVersion 26
    defaultConfig {
        applicationId "com.pinillos.auxilium"
        minSdkVersion 21
        targetSdkVersion 26
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        renderscriptTargetApi 26
        renderscriptSupportModeEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.android.support:animated-vector-drawable:26.1.0'
    implementation 'com.android.support.constraint:constraint-layout:1.0.2'
    implementation 'com.google.firebase:firebase-auth:11.6.2'
    implementation 'com.android.support:design:26.1.0'
    implementation 'com.google.android.gms:play-services-maps:11.6.2'
    implementation 'com.android.support:support-v4:26.1.0'
    implementation 'com.google.firebase:firebase-storage:11.6.2'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
    compile 'com.google.android.gms:play-services-places:11.6.2'
    compile 'com.google.android.gms:play-services-location:11.6.2'
    compile 'com.google.firebase:firebase-database:11.6.2'
    compile 'com.google.firebase:firebase-messaging:11.6.2'
    compile 'com.android.support:design:26.1.0'
    compile 'com.squareup.picasso:picasso:2.5.2'
    compile 'de.hdodenhof:circleimageview:2.2.0'
    compile 'com.getbase:floatingactionbutton:1.10.1'
    compile 'com.firebaseui:firebase-ui-storage:0.6.0'
    implementation files('libs/universal-image-loader-1.9.5.jar')
    compile 'fr.tvbarthel.blurdialogfragment:lib:2.2.0'
    compile 'com.github.apg-mobile:android-round-textview:v1.0.0'
}









apply plugin: 'com.google.gms.google-services'

afterEvaluate {
    task jacocoTestReport(type: JacocoReport, dependsOn: 'testDebugUnitTest') {
        reports {
            xml.enabled = true
            html.enabled = true
        }
        sourceDirectories = files('src/main/java')
        classDirectories = fileTree(dir: "$buildDir/intermediates/classes/debug", excludes: [
            '**/R.class', '**/R$*.class', '**/BuildConfig.class', '**/Manifest*.class'
        ])
        executionData = fileTree(dir: buildDir, includes: ['jacoco/*.exec'])
    }
}
